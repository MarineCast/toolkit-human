[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-human"
version = "0.1.0"
description = "Human access, activity, population and reporting-opportunity data products"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "affine>=2.4", "branca>=0.7", "folium>=0.20", "geopandas>=1", "h3>=4",
  "holidays>=0.50", "joblib>=1.3", "matplotlib>=3.8", "numba>=0.60",
  "numpy>=1.26", "pandas>=2.1", "Pillow>=10", "polars>=1", "psutil>=5.9",
  "pyarrow>=14", "pydantic>=2", "pyproj>=3.6", "python-dotenv>=1",
  "PyYAML>=6", "rasterio>=1.4", "requests>=2.31", "scipy>=1.11",
  "shapely>=2", "tqdm>=4.66", "xarray>=2024.1",
]

[project.optional-dependencies]
acquisition = ["py3dep", "rioxarray", "xarray-spatial", "tableauhyperapi", "pypdf"]
meteorology = ["toolkit-meteorology>=0.1.0"]
test = ["pytest>=8"]

[project.scripts]
human = "human.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
human = ["resources/**/*", "**/*.yaml", "**/*.lua", "**/*.md", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
