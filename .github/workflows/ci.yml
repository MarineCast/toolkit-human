name: Human pipeline checks
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONTZPATH: ""
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pip check
      - name: Supported producer and package tests
        run: python -m pytest -q -m "not legacy" tests/test_census_acquisition.py tests/test_extracted_census.py tests/test_run_settings.py tests/test_pipeline.py tests/test_static_delivery.py tests/test_native_features.py tests/test_ports.py tests/test_collected_population.py tests/test_static_water_support.py tests/test_calendar_lookup.py tests/test_population_static.py tests/test_population_collection.py tests/test_statcan_gaf.py tests/test_static_matrix.py tests/test_study.py tests/test_packaging.py tests/human/test_feature_catalog.py tests/human/test_structure.py
      - run: python -m pyflakes src/human/main.py src/human/pipelines src/human/utils/downloads.py src/human/utils/study.py src/human/cli.py tests/test_census_acquisition.py tests/test_extracted_census.py tests/test_run_settings.py
      - run: python scripts/check_pipeline_docs.py
      - run: human get-human-data --help
      - run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/dist"
      - name: Installed wheel pipeline test
        run: |
          wheel_env="$RUNNER_TEMP/wheel-env"
          python -m venv "$wheel_env"
          "$wheel_env/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl pytest
          "$wheel_env/bin/python" -m pip check
          outside="$RUNNER_TEMP/wheel-smoke"
          mkdir -p "$outside/tests"
          cp scripts/check_installed_wheel.py "$outside/"
          cp tests/test_census_acquisition.py tests/test_extracted_census.py tests/test_run_settings.py tests/test_pipeline.py tests/test_static_delivery.py tests/test_native_features.py tests/test_ports.py tests/test_collected_population.py tests/test_static_water_support.py tests/test_calendar_lookup.py tests/test_population_static.py tests/test_population_collection.py tests/test_statcan_gaf.py "$outside/tests/"
          touch "$outside/tests/__init__.py"
          cd "$outside"
          unset PYTHONPATH HUMAN_WORKSPACE
          "$wheel_env/bin/python" check_installed_wheel.py
          "$wheel_env/bin/python" -m pytest -q --import-mode=importlib tests
      - run: git diff --check
